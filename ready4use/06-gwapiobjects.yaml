
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gw
  namespace: agentgateway-system
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: { from: All }

  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: stocktrader-tls
    allowedRoutes:
      namespaces: { from: All }
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stocktrader
  namespace: stocktrader
spec:
  parentRefs:
  - name: public-gw
    namespace: agentgateway-system
    sectionName: http
  hostnames:
  - "stapi.cloudoptimization.kynhost.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /trader
    backendRefs:
    - name: example-trader-service
      port: 9080
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stocktraders
  namespace: stocktrader
spec:
  parentRefs:
  - name: public-gw
    namespace: agentgateway-system
    sectionName: https
  hostnames:
  - "stapi.cloudoptimization.kynhost.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /trader
    backendRefs:
    - name: example-trader-service
      port: 9080 #Not 9443 because skip verify is not supported, need to add CA Stocktrader

