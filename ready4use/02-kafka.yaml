#-- CREATE KAFKA CLUSTER OPERATOR
# Assumes Strimzi Operator is already installed in the 'kafka' namespace
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: stocktrader-kafka
  namespace: kafka
spec:
  kafka:
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    storage:
      type: ephemeral
  zookeeper:
    replicas: 1
    storage:
      type: ephemeral
  entityOperator:
    topicOperator: {}
    userOperator: {}
--- #CREATE TOPICS
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: account
  labels:
    strimzi.io/cluster: stocktrader-kafka
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: broker
  labels:
    strimzi.io/cluster: stocktrader-kafka
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cash-account
  labels:
    strimzi.io/cluster: stocktrader-kafka
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: portfolio
  labels:
    strimzi.io/cluster: stocktrader-kafka
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: stocktrader-user
  labels:
    strimzi.io/cluster: stocktrader-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: account
          patternType: literal
        operation: Read
      - resource:
          type: topic
          name: account
          patternType: literal
        operation: Write
      - resource:
          type: topic
          name: broker
          patternType: literal
        operation: Read
      - resource:
          type: topic
          name: broker
          patternType: literal
        operation: Write
      - resource:
          type: topic
          name: cash-account
          patternType: literal
        operation: Read
      - resource:
          type: topic
          name: cash-account
          patternType: literal
        operation: Write
      - resource:
          type: topic
          name: portfolio
          patternType: literal
        operation: Read
      - resource:
          type: topic
          name: portfolio
          patternType: literal
        operation: Write